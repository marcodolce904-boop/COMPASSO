name: Release

# Release automatica: a ogni push su main, se la versione di apps/illustrator/package.json
# non ha ancora una release (tag v<versione>), la crea:
#  1. su Windows: build e firma del pannello → Compasso.zxp (certificato self-signed);
#  2. su Linux: ZIP con .zxp + installer a doppio clic + istruzioni, tag e pubblicazione.
# Per una nuova versione basta aumentare "version" in apps/illustrator/package.json.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./apps/illustrator/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$VERSION esiste già: niente da pubblicare"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "Nuova release v$VERSION"
          fi

  zxp:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F illustrator zxp
      - uses: actions/upload-artifact@v4
        with:
          name: zxp
          path: apps/illustrator/dist/zxp/*.zxp
          if-no-files-found: error

  package:
    needs: [check, zxp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: zxp
          path: zxp
      - run: scripts/package-release.sh "$(ls zxp/*.zxp | head -n 1)" release
      - uses: actions/upload-artifact@v4
        with:
          name: Compasso
          path: release/*
      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Compasso ${{ needs.check.outputs.version }}
          prerelease: true
          files: |
            release/Compasso-Windows-macOS.zip
            release/Compasso.zxp
          body: |
            **Compasso** per Adobe Illustrator 2026 (v31) e successivi — Windows e macOS.

            ### Installazione (1 minuto)
            1. Scarica **Compasso-Windows-macOS.zip** qui sotto ed estrai tutto.
            2. Chiudi Illustrator e fai doppio clic su **Installa Compasso (Windows).bat** o **Installa Compasso (macOS).command**.
            3. Apri Illustrator → **Finestra → Estensioni → Compasso**.

            Usi già «ZXP Installer»? Scarica solo **Compasso.zxp** e trascinalo nella sua finestra.

            Novità: vedi [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
