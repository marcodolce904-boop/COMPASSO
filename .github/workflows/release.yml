name: Release

# Release automatica: a ogni push su main, se la versione di apps/illustrator/package.json
# non ha ancora una release (tag v<versione>), la crea su Windows:
#   build e firma del pannello → cartella firmata → Compasso-Setup.exe (Inno Setup)
#   → prova di installazione e disinstallazione → pubblicazione.
# Per una nuova versione basta aumentare "version" in apps/illustrator/package.json.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./apps/illustrator/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$VERSION esiste già: niente da pubblicare"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "Nuova release v$VERSION"
          fi

  verify:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lo script per Illustrator della build distribuibile, poi tutti i test (anche quelli sul bundle)
      - run: cd apps/illustrator && NODE_ENV=production ZXP_PACKAGE=true npx vite build --watch false || true
      - run: test -f apps/illustrator/dist/cep/jsx/index.js
      - run: pnpm test
      - run: pnpm lint

  installer:
    needs: [check, verify]
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      EXT_DIR: apps\illustrator\dist\signed\Compasso
      ZXPSIGN: apps\illustrator\node_modules\vite-cep-plugin\lib\bin\ZXPSignCmd.exe
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build e firma del pannello
        run: pnpm -F illustrator zxp

      - name: Cartella firmata (il pacchetto firmato, estratto)
        shell: pwsh
        run: |
          $zxp = Get-ChildItem apps\illustrator\dist\zxp\*.zxp | Select-Object -First 1
          if (-not $zxp) { throw "pacchetto firmato non trovato" }
          7z x $zxp.FullName "-o$env:EXT_DIR" -y | Out-Null
          Get-ChildItem $env:EXT_DIR -Force | Format-Table Name
          foreach ($f in 'CSXS\manifest.xml', 'main\index.html', 'jsx\index.js', 'META-INF\signatures.xml') {
            if (-not (Test-Path (Join-Path $env:EXT_DIR $f))) { throw "manca $f" }
          }
          if (Select-String -Path (Join-Path $env:EXT_DIR 'main\index.html') -Pattern 'localhost' -Quiet) {
            throw "index.html punta al server di sviluppo"
          }
          if (-not (Select-String -Path (Join-Path $env:EXT_DIR 'jsx\index.js') -Pattern 'typeof JSON' -SimpleMatch -Quiet)) {
            throw "jsx/index.js non contiene la libreria JSON (json2)"
          }
          & $env:ZXPSIGN -verify $env:EXT_DIR
          if ($LASTEXITCODE -ne 0) { throw "firma non valida sulla cartella estratta" }

      - name: Compila Compasso-Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:VERSION" installer\compasso.iss
          if ($LASTEXITCODE -ne 0) { throw "compilazione dell'installer fallita" }
          Copy-Item installer\Compasso-Diagnostica.bat release\
          Get-ChildItem release

      - name: Prova - installa, verifica, disinstalla
        shell: pwsh
        run: |
          $dest = "$env:APPDATA\Adobe\CEP\extensions\com.marcodolce.compasso"
          $p = Start-Process release\Compasso-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer uscito con codice $($p.ExitCode)" }
          foreach ($f in 'CSXS\manifest.xml', 'main\index.html', 'jsx\index.js', 'META-INF\signatures.xml') {
            if (-not (Test-Path (Join-Path $dest $f))) { throw "dopo l'installazione manca $f" }
          }
          & $env:ZXPSIGN -verify $dest
          if ($LASTEXITCODE -ne 0) { throw "firma non valida sulla cartella installata" }
          Write-Host "Installazione OK in $dest"
          # reinstallazione sopra la precedente (aggiornamento)
          $p = Start-Process release\Compasso-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "reinstallazione fallita" }
          & $env:ZXPSIGN -verify $dest
          if ($LASTEXITCODE -ne 0) { throw "firma non valida dopo l'aggiornamento" }
          $un = Get-ChildItem "$env:LOCALAPPDATA\Compasso\uninstall\unins*.exe" | Select-Object -First 1
          if (-not $un) { throw "disinstallatore non trovato" }
          Start-Process $un.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $dest) { throw "la disinstallazione ha lasciato $dest" }
          Write-Host "Disinstallazione OK"

      - uses: actions/upload-artifact@v4
        with:
          name: Compasso-Setup
          path: release/*
          if-no-files-found: error

      - name: Rimuovi le vecchie anteprime (0.1.x, con installer difettosi)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($t in 'v0.1.0', 'v0.1.1') {
            gh release delete $t --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes 2>$null
            Write-Host "release ${t}: rimossa o assente"
          }
          exit 0

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Compasso ${{ needs.check.outputs.version }}
          prerelease: false
          make_latest: true
          files: |
            release/Compasso-Setup.exe
            release/Compasso-Diagnostica.bat
          body: |
            **Compasso** per Adobe Illustrator su **Windows** (Illustrator 2026 e successivi).

            ### Installazione
            1. Scarica **Compasso-Setup.exe** qui sotto e fai doppio clic.
               Se Windows mostra «PC protetto»: *Ulteriori informazioni → Esegui comunque*.
            2. Premi **Installa**, poi **Fine**.
            3. Apri Illustrator → **Finestra → Estensioni → Compasso** (o *Estensioni (legacy)*).

            Per disinstallare: Impostazioni di Windows → App installate → Compasso.
            Il pannello non compare? Scarica ed esegui **Compasso-Diagnostica.bat** (solo lettura) e invia il file che salva sul Desktop.

            Novità: vedi [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
